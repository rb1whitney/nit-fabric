name: nit-fabric Industrial CI

on:
  push:
    branches: [master]
  pull_request:
    paths:
      - 'src/**'
      - 'terraform/**'
      - '.agent/skills/**'
      - 'tests/**'
      - 'pyproject.toml'

permissions:
  contents: read

jobs:
  hcl_quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
      - name: Terraform Format Check
        run: terraform fmt -check -recursive
      - name: TFLint Audit
        uses: terraform-linters/setup-tflint@ba6bb2989f94daf58a4cc6eac2c1ca7398a678bf # SHA-Pinning v3.0.0
      - run: tflint --recursive

  security_boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Checkov Sovereignty Scan
        uses: bridgecrewio/checkov-action@99bb2caf247dfd9f03cf984373bc6043d4e32ebf # SHA-Pinning v12.1347.0
        with:
          directory: terraform/
          framework: terraform
          quiet: true

  logic_integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint with Ruff
        run: ruff check src tests
      - name: Run pytest
        run: pytest tests/
