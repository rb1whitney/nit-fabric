name: nit-fabric Industrial CI

on:
  pull_request:
    paths:
      - 'terraform/**'
      - 'skills/**'

# STAFF HARDENING: Identity Sovereignty (OIDC Connect Permits)
permissions:
  id-token: write
  contents: read

jobs:
  hcl_quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
      - name: Terraform Format Check
        run: terraform fmt -check -recursive
      - name: TFLint Audit
        uses: terraform-linters/setup-tflint@ba6bb2989f94daf58a4cc6eac2c1ca7398a678bf # SHA-Pinning v3.0.0
      - run: tflint --recursive

  security_boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: OIDC Authentication (Identity Sovereignty)
        run: echo 'Staff Hardening - OIDC Auth Handshake Simulated'
      - name: Checkov Sovereignty Scan
        uses: bridgecrewio/checkov-action@99bb2caf247dfd9f03cf984373bc6043d4e32ebf # SHA-Pinning v12.1347.0
        with:
          directory: terraform/
          framework: terraform
          quiet: true

  logic_integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Python Logic Audit
        run: |
          pip install pytest pylint pydantic
          pytest skills/
          pylint --errors-only skills/
